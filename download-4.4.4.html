<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Download VTO Watcher 4.4.4</title>
  <style>
    :root{--bg:#06101d;--text:#f7fbff;--muted:#92a6bc;--green:#5bf2b5;--green2:#27d894;--red:#ff6475}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 18% 0%,rgba(91,242,181,.12),transparent 36%),var(--bg)}
    .card{width:min(540px,100%);padding:34px;border:1px solid rgba(91,242,181,.19);border-radius:30px;background:linear-gradient(180deg,#0d1d33,#07121f);box-shadow:0 30px 94px rgba(0,0,0,.40)}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900}.v{width:36px;height:36px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(180deg,#75fac7,var(--green2));color:#04140d;font-weight:950}
    h1{margin:28px 0 10px;font-size:32px;letter-spacing:-.045em}p{color:var(--muted);line-height:1.65}
    .status{margin-top:20px;padding:14px;border-radius:18px;background:rgba(91,242,181,.075);border:1px solid rgba(91,242,181,.10);color:#c9fae2;font-size:13px;font-weight:800}
    .button,button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:17px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900;cursor:pointer;background:linear-gradient(180deg,#73fac5,var(--green2));color:#04140d;font:inherit;font-weight:900}
    button.secondary,.button.secondary{background:#162a48;color:#eef5ff;border:1px solid rgba(255,255,255,.08)}
    .hidden{display:none!important}.small{font-size:11px}.error{color:#ffd9de;border-color:rgba(255,100,117,.2);background:rgba(255,100,117,.08)}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="v">V</span><span>VTO Watcher</span></div>
    <h1>Download v4.4.4</h1>
    <p>The release is prepared from the current GitHub update files. When it is ready, use the green button below to download the ZIP.</p>

    <div id="status" class="status">Preparing release…</div>
    <a id="downloadNow" class="button hidden" href="#" download="VTO_Watcher_4.4.4.zip">Download VTO Watcher 4.4.4 ZIP</a>
    <button id="retry" class="secondary hidden">Try again</button>
    <a id="fallback" class="button secondary hidden" href="https://vtowatcher.pages.dev/download-4.4.3.html">Use v4.4.3 fallback</a>
    <p class="small">A valid VTO Watcher license is still required to use the extension.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const BASE='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/VTO_Watcher_4.2.6.zip';
    const CONTENT_CSS='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.4.1/content.css';
    const POPUP_CSS='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.4.4/popup.css';
    const POPUP_HTML='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.4.4/popup.html';
    const MANIFEST='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.4.4/manifest.json';
    const BACKGROUND='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.2.7/background_427.js';
    const RELOAD_GUARD='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.2.9/reload_guard_429.js';
    const REFRESH_PATCH='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.3.1/content_patch_431.js';
    const RUNTIME_PATCH='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.3.2/runtime_patch_432.js';
    const RUNTIME_GUARD='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.3.3/runtime_guard_433.js';
    const CLICK_GUARD='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.3.4/click_guard_434.js';
    const ACCEPT_PATCH='https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/4.3.4/accept_patch_434.js';

    const statusEl=document.getElementById('status');
    const retry=document.getElementById('retry');
    const fallback=document.getElementById('fallback');
    const downloadNow=document.getElementById('downloadNow');
    let objectUrl=null;

    async function get(url,type='text'){
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error(`HTTP ${r.status} loading ${url}`);
      return type==='arrayBuffer'?r.arrayBuffer():r.text();
    }

    async function build(){
      if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}
      downloadNow.classList.add('hidden');
      retry.classList.add('hidden');
      fallback.classList.add('hidden');
      statusEl.classList.remove('error');
      statusEl.textContent='Loading release files from GitHub…';

      try{
        if(typeof JSZip==='undefined') throw new Error('ZIP library did not load');
        const [base,contentCss,popupCss,popupHtml,manifest,background,reloadGuard,refreshPatch,runtimePatch,runtimeGuard,clickGuard,acceptPatch]=await Promise.all([
          get(BASE,'arrayBuffer'),get(CONTENT_CSS),get(POPUP_CSS),get(POPUP_HTML),get(MANIFEST),get(BACKGROUND),get(RELOAD_GUARD),get(REFRESH_PATCH),get(RUNTIME_PATCH),get(RUNTIME_GUARD),get(CLICK_GUARD),get(ACCEPT_PATCH)
        ]);

        statusEl.textContent='Building VTO Watcher v4.4.4…';
        const zip=await JSZip.loadAsync(base);
        zip.file('content.css',contentCss);
        zip.file('popup.css',popupCss);
        zip.file('popup.html',popupHtml);
        zip.file('manifest.json',manifest);
        zip.file('background_427.js',background);
        zip.file('reload_guard_429.js',reloadGuard);
        zip.file('content_patch_431.js',refreshPatch);
        zip.file('runtime_patch_432.js',runtimePatch);
        zip.file('runtime_guard_433.js',runtimeGuard);
        zip.file('click_guard_434.js',clickGuard);
        zip.file('accept_patch_434.js',acceptPatch);
        zip.file('README_4.4.4.txt','VTO Watcher 4.4.4\n\n- fixes popup corner seam\n- preserves balanced license layout\n- preserves live-VTO behavior, persistent runtime, soft refresh and white-screen protection\n\nReload the extension in chrome://extensions after updating.\n');

        const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
        objectUrl=URL.createObjectURL(blob);
        downloadNow.href=objectUrl;
        downloadNow.classList.remove('hidden');
        statusEl.textContent='Ready — click Download below.';
      }catch(e){
        console.error(e);
        statusEl.textContent='Could not prepare the ZIP. Try again or use the fallback release.';
        statusEl.classList.add('error');
        retry.classList.remove('hidden');
        fallback.classList.remove('hidden');
      }
    }

    retry.addEventListener('click',build);
    window.addEventListener('beforeunload',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl)});
    build();
  </script>
</body>
</html>
