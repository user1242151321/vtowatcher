name: Build VTO Watcher 4.4.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vto-4.4.4.yml'
      - 'release-data/4.4.4/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild static ZIP from verified release data
        shell: bash
        run: |
          set -euo pipefail
          cat release-data/4.4.4/part*.b64 | base64 --decode > updates/VTO_Watcher_4.4.4.zip
          unzip -tq updates/VTO_Watcher_4.4.4.zip

          ACTUAL="$(sha256sum updates/VTO_Watcher_4.4.4.zip | awk '{print $1}')"
          EXPECTED="b26de27b24794b970de61b21bc7de0519b76561f43d7d18a8321575298b52576"
          echo "ZIP SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('updates/VTO_Watcher_4.4.4.zip') as z:
              assert z.testzip() is None
              manifest = json.loads(z.read('manifest.json'))
              assert manifest['version'] == '4.4.4', manifest['version']
          print('VTO Watcher 4.4.4 ZIP verified')
          PY

      - name: Point release feed at the static ZIP
        shell: bash
        run: |
          cat > updates/latest.json <<'JSON'
          {
            "latestVersion": "4.4.4",
            "minimumVersion": "4.0.0",
            "message": "V4.4.4 fixes the remaining popup corner seam and now downloads as a direct prebuilt GitHub ZIP.",
            "downloadUrl": "https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/VTO_Watcher_4.4.4.zip"
          }
          JSON

      - name: Commit release ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/VTO_Watcher_4.4.4.zip updates/latest.json
          if git diff --cached --quiet; then
            echo "Release already up to date."
            exit 0
          fi
          git commit -m "Publish static VTO Watcher 4.4.4 ZIP"
          git push
