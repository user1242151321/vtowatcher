name: Release VTO Watcher 4.7.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-vto-4.7.2.yml'
      - 'updates/4.7.2/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate 4.7.2
        run: |
          set -euo pipefail
          rm -rf .release-472
          mkdir -p .release-472
          unzip -q updates/VTO_Watcher_4.7.0.zip -d .release-472

          cp updates/4.7.2/manifest.json .release-472/manifest.json
          cp updates/4.7.2/popup.html .release-472/popup.html
          cp updates/4.7.2/popup_471.css .release-472/popup_471.css
          cp updates/4.7.2/content_471.css .release-472/content_471.css

          node --check .release-472/filters_470.js
          node --check .release-472/vto_engine_450.js
          node --check .release-472/popup.js
          node --check .release-472/reliability_465.js
          node --check .release-472/session_guard_464.js
          node --check .release-472/background_450.js

          python - <<'PY'
          import json,re
          from pathlib import Path
          r=Path('.release-472')
          m=json.loads((r/'manifest.json').read_text())
          assert m['version']=='4.7.2'
          css=m['content_scripts'][0]['css']
          assert 'content_471.css' in css
          h=(r/'popup.html').read_text()
          assert 'popup_471.css' in h
          assert (r/'popup_471.css').exists()
          assert (r/'content_471.css').exists()
          pc=(r/'popup_471.css').read_text()
          cc=(r/'content_471.css').read_text()
          assert 'border-radius:0!important' in pc
          assert 'border-radius:0!important' in cc
          # outer shells must be square in the override
          assert re.search(r'\.shell\s*\{[^}]*border-radius:0!important',pc,re.S)
          assert re.search(r'#vto-v4-panel\s*\{[^}]*border-radius:0!important',cc,re.S)
          PY

          rm -f updates/VTO_Watcher_4.7.2.zip
          (cd .release-472 && zip -qr ../updates/VTO_Watcher_4.7.2.zip .)
          unzip -tq updates/VTO_Watcher_4.7.2.zip
          SHA="$(sha256sum updates/VTO_Watcher_4.7.2.zip | awk '{print $1}')"

          cat > updates/latest.json <<JSON
          {
            "latestVersion": "4.7.2",
            "minimumVersion": "4.0.0",
            "message": "V4.7.2 keeps all V4.7.0 matching, acceptance, session and reliability features while making the extension popup and floating watcher fully rectangular with square 0px corners.",
            "downloadUrl": "https://raw.githubusercontent.com/user1242151321/vtowatcher/main/updates/VTO_Watcher_4.7.2.zip",
            "sha256": "$SHA"
          }
          JSON

          echo "$SHA  VTO_Watcher_4.7.2.zip" > updates/VTO_Watcher_4.7.2.sha256
          rm -rf .release-472

      - name: Update website fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()
          s=s.replace('const FALLBACK_VERSION = "4.7.0";','const FALLBACK_VERSION = "4.7.2";')
          s=s.replace('VTO_Watcher_4.7.0.zip','VTO_Watcher_4.7.2.zip')
          s=s.replace('V4.7.0 adds date ranges, weekday filters, allowed hours, min/max VTO length, priority windows, and persistent matching settings.','V4.7.2 keeps the advanced VTO matching and reliability features while switching the popup and floating watcher to fully square rectangular corners.')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('v4.7.0','v4.7.2')
          s=s.replace('V4.7</span>','V4.7</span>')
          s=s.replace('VTO_Watcher_4.7.0.zip','VTO_Watcher_4.7.2.zip')
          p.write_text(s)
          PY

      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html updates/latest.json updates/VTO_Watcher_4.7.2.zip updates/VTO_Watcher_4.7.2.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish VTO Watcher 4.7.2"
          git push
